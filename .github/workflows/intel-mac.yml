name: Intel Mac app build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed --name 'Meshtastic Sniffer TCP' --collect-all meshtastic --collect-all pubsub app.py
          hdiutil create -volname 'Meshtastic Sniffer TCP' -srcfolder 'dist/Meshtastic Sniffer TCP.app' -ov -format UDZO dist/Meshtastic-Sniffer-TCP-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Meshtastic-Sniffer-TCP-Intel
          path: |
            dist/*.dmg
            dist/*.app/**
