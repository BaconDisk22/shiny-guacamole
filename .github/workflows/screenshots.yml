name: UI screenshots
on:
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install UI dependency
        run: python -m pip install 'PySide6>=6.7,<7'
      - name: Capture demo dashboard
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_screenshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: docs/screenshots/*.png
